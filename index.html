<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Шифрование и расшифрование русского текста шифром Цезаря с ключом 7">
  <title>Тайнопись — шифр Цезаря</title>
  <style>
    :root {
      color-scheme: light;
      --page: #eef3f8;
      --surface: #ffffff;
      --surface-soft: #f7f9fc;
      --text: #172033;
      --muted: #667085;
      --line: #d7dfeb;
      --blue: #2458d6;
      --blue-dark: #1744af;
      --blue-soft: #eaf0ff;
      --green: #15805d;
      --danger: #b42318;
      --shadow: 0 18px 45px rgba(24, 39, 75, 0.11);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(36, 88, 214, 0.08), transparent 42%),
        var(--page);
      color: var(--text);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--blue);
      font-size: 0.83rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.7rem);
      line-height: 1.12;
      letter-spacing: -0.035em;
    }

    .key-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      padding: 10px 12px 10px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 22px rgba(24, 39, 75, 0.06);
    }

    .key-box label {
      color: var(--muted);
      font-weight: 700;
    }

    .key-box input {
      width: 58px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface-soft);
      color: var(--text);
      text-align: center;
      font-weight: 800;
    }

    .workspace {
      overflow: hidden;
      border: 1px solid rgba(191, 202, 218, 0.9);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .panel {
      min-width: 0;
      padding: 22px;
    }

    .panel + .panel {
      border-left: 1px solid var(--line);
      background: var(--surface-soft);
    }

    .panel-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 1rem;
    }

    .counter {
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 320px;
      resize: vertical;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: #ffffff;
      color: var(--text);
      line-height: 1.6;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(36, 88, 214, 0.13);
    }

    textarea[readonly] {
      background: #f9fbff;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding: 16px 22px;
      border-top: 1px solid var(--line);
      background: #fbfcfe;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      border: 1px solid transparent;
      border-radius: 11px;
      cursor: pointer;
      font-weight: 750;
      transition: transform 0.12s, background 0.2s, border-color 0.2s;
    }

    button:active {
      transform: translateY(1px);
    }

    button:focus-visible {
      outline: 3px solid rgba(36, 88, 214, 0.28);
      outline-offset: 2px;
    }

    .primary {
      background: var(--blue);
      color: #ffffff;
    }

    .primary:hover {
      background: var(--blue-dark);
    }

    .secondary {
      border-color: var(--line);
      background: #ffffff;
      color: var(--text);
    }

    .secondary:hover {
      border-color: #aebbd0;
      background: #f5f7fb;
    }

    .danger {
      margin-left: auto;
      border-color: #f0c8c4;
      background: #fff8f7;
      color: var(--danger);
    }

    .status {
      min-height: 24px;
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .status.success {
      color: var(--green);
    }

    .status.error {
      color: var(--danger);
    }

    details {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.78);
    }

    summary {
      padding: 14px 16px;
      cursor: pointer;
      font-weight: 750;
    }

    .alphabet {
      overflow-x: auto;
      margin: 0;
      padding: 0 16px 16px;
      color: #344054;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.9rem;
      line-height: 1.8;
      white-space: pre;
    }

    @media (max-width: 820px) {
      .page {
        width: min(100% - 20px, 680px);
        padding: 22px 0;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .panels {
        grid-template-columns: 1fr;
      }

      .panel + .panel {
        border-top: 1px solid var(--line);
        border-left: 0;
      }

      textarea {
        min-height: 230px;
      }

      .danger {
        margin-left: 0;
      }
    }

    @media (max-width: 520px) {
      .actions button {
        flex: 1 1 calc(50% - 10px);
      }

      .actions .danger {
        flex-basis: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <p class="eyebrow">Лабораторная работа № 1</p>
        <h1>Тайнопись: шифр Цезаря</h1>
      </div>

      <div class="key-box">
        <label for="key">Ключ</label>
        <input id="key" type="number" min="0" max="32" value="7" aria-describedby="keyHint">
      </div>
    </header>

    <section class="workspace" aria-label="Программа шифрования">
      <div class="panels">
        <div class="panel">
          <div class="panel-heading">
            <h2><label for="sourceText">Исходный текст</label></h2>
            <span class="counter" id="sourceCount">0 символов</span>
          </div>
          <textarea id="sourceText" placeholder="Вставьте сюда текст варианта 3 или 4" autofocus></textarea>
        </div>

        <div class="panel">
          <div class="panel-heading">
            <h2><label for="resultText">Результат</label></h2>
            <span class="counter" id="resultCount">0 символов</span>
          </div>
          <textarea id="resultText" placeholder="Здесь появится результат" readonly></textarea>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="encryptButton" type="button">Зашифровать</button>
        <button class="secondary" id="decryptButton" type="button">Расшифровать</button>
        <button class="secondary" id="swapButton" type="button">Поменять местами</button>
        <button class="secondary" id="copyButton" type="button">Копировать результат</button>
        <button class="danger" id="clearButton" type="button">Очистить</button>
      </div>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">Введите текст и выберите действие.</p>

    <details>
      <summary id="keyHint">Используемый условный алфавит</summary>
      <pre class="alphabet">Открытый: АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ
Шифровой: ЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯАБВГДЕЁ</pre>
    </details>
  </main>

  <script>
    const LOWER_ALPHABET = 'абвгдеёжзийклмнопрстуфхцчшщъыьэюя';
    const UPPER_ALPHABET = LOWER_ALPHABET.toUpperCase();

    const sourceText = document.getElementById('sourceText');
    const resultText = document.getElementById('resultText');
    const keyInput = document.getElementById('key');
    const sourceCount = document.getElementById('sourceCount');
    const resultCount = document.getElementById('resultCount');
    const status = document.getElementById('status');

    function normalizedKey() {
      const alphabetLength = LOWER_ALPHABET.length;
      const enteredKey = Number.parseInt(keyInput.value, 10);
      const safeKey = Number.isFinite(enteredKey) ? enteredKey : 7;
      const normalized = ((safeKey % alphabetLength) + alphabetLength) % alphabetLength;

      keyInput.value = normalized;
      return normalized;
    }

    function shiftText(text, shift) {
      const alphabetLength = LOWER_ALPHABET.length;

      return Array.from(text, (character) => {
        let alphabet = LOWER_ALPHABET;
        let position = alphabet.indexOf(character);

        if (position === -1) {
          alphabet = UPPER_ALPHABET;
          position = alphabet.indexOf(character);
        }

        if (position === -1) {
          return character;
        }

        const newPosition = ((position + shift) % alphabetLength + alphabetLength) % alphabetLength;
        return alphabet[newPosition];
      }).join('');
    }

    function updateCounters() {
      sourceCount.textContent = `${Array.from(sourceText.value).length} символов`;
      resultCount.textContent = `${Array.from(resultText.value).length} символов`;
    }

    function showStatus(message, type = '') {
      status.textContent = message;
      status.className = `status ${type}`.trim();
    }

    function processText(direction) {
      if (!sourceText.value) {
        showStatus('Сначала введите исходный текст.', 'error');
        sourceText.focus();
        return;
      }

      const key = normalizedKey();
      const shift = direction === 'encrypt' ? key : -key;
      resultText.value = shiftText(sourceText.value, shift);
      updateCounters();

      showStatus(
        direction === 'encrypt'
          ? `Текст зашифрован. Использован ключ ${key}.`
          : `Текст расшифрован. Использован ключ ${key}.`,
        'success'
      );
    }

    async function copyResult() {
      if (!resultText.value) {
        showStatus('Пока нечего копировать.', 'error');
        return;
      }

      try {
        await navigator.clipboard.writeText(resultText.value);
      } catch (error) {
        resultText.removeAttribute('readonly');
        resultText.select();
        document.execCommand('copy');
        resultText.setAttribute('readonly', '');
      }

      showStatus('Результат скопирован.', 'success');
    }

    document.getElementById('encryptButton').addEventListener('click', () => processText('encrypt'));
    document.getElementById('decryptButton').addEventListener('click', () => processText('decrypt'));

    document.getElementById('swapButton').addEventListener('click', () => {
      if (!resultText.value) {
        showStatus('Сначала получите результат.', 'error');
        return;
      }

      const previousSource = sourceText.value;
      sourceText.value = resultText.value;
      resultText.value = previousSource;
      updateCounters();
      showStatus('Тексты поменяны местами.', 'success');
    });

    document.getElementById('copyButton').addEventListener('click', copyResult);

    document.getElementById('clearButton').addEventListener('click', () => {
      sourceText.value = '';
      resultText.value = '';
      keyInput.value = 7;
      updateCounters();
      showStatus('Поля очищены.');
      sourceText.focus();
    });

    sourceText.addEventListener('input', updateCounters);
    keyInput.addEventListener('change', normalizedKey);

    sourceText.addEventListener('keydown', (event) => {
      if (event.ctrlKey && event.key === 'Enter') {
        event.preventDefault();
        processText(event.shiftKey ? 'decrypt' : 'encrypt');
      }
    });

    updateCounters();
  </script>
</body>
</html>
